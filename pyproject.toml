[project]
name = "momentum-library"
version = "0.2.0"
description = "Library catalogue and borrowing API"
authors = []
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "uvicorn>=0.34,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
httpx2 = ">=2.16,<3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: integration tests requiring TEST_DATABASE_URL"]
